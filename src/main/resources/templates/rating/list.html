<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="utf-8"/>
	<title>Rating List</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">

	<div class="row">
		<div class="col-6">
			<a th:href="@{/bidList/list}">Bid List</a> |
			<a th:href="@{/curvePoint/list}">Curve Points</a> |
			<a th:href="@{/rating/list}">Ratings</a> |
			<a th:href="@{/trade/list}">Trade</a> |
			<a th:href="@{/ruleName/list}">Rule</a>
		</div>

		<div class="col-6 text-right">
			Logged in user:
			<b sec:authentication="name"></b>

			<form th:action="@{/logout}" method="POST">
				<input type="submit" value="Logout"/>
			</form>
		</div>
	</div>

	<div class="row">
		<h2>Rating List</h2>
	</div>

	<div class="row">
		<a th:href="@{/rating/add}" class="btn btn-primary btn-sm">
			Add New
		</a>

		<table class="table table-bordered">
			<thead>
			<tr>
				<th>Id</th>
				<th>MoodysRating</th>
				<th>SandPRating</th>
				<th>FitchRating</th>
				<th>Order</th>
				<th>Action</th>
			</tr>
			</thead>

			<tbody>
			<tr th:each="rating : ${ratings}">
				<td th:text="${rating.id}"></td>
				<td th:text="${rating.moodysRating}"></td>
				<td th:text="${rating.sandPRating}"></td>
				<td th:text="${rating.fitchRating}"></td>
				<td th:text="${rating.orderNumber}"></td>
				<td>
					<a th:href="@{/rating/update/{id}(id=${rating.id})}">
						Edit
					</a> |
					<a th:href="@{/rating/delete/{id}(id=${rating.id})}">
						Delete
					</a>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</div>
</body>
</html>

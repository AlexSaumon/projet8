<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" 
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Add Rating</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">

	<h2>Add New Rating</h2>

	<form th:action="@{/rating/validate}"
		  th:object="${rating}"
		  method="post"
		  class="form-horizontal">

		<div class="form-group">
			<label for="moodysRating">MoodysRating</label>
			<input type="number" th:field="*{moodysRating}"
				   id="moodysRating" class="col-4">

			<p class="text-danger"
			   th:if="${#fields.hasErrors('moodysRating')}"
			   th:errors="*{moodysRating}"></p>
		</div>

		<div class="form-group">
			<label for="sandPRating">SandPRating</label>
			<input type="number" th:field="*{sandPRating}"
				   id="sandPRating" class="col-4">

			<p class="text-danger"
			   th:if="${#fields.hasErrors('sandPRating')}"
			   th:errors="*{sandPRating}"></p>
		</div>

		<div class="form-group">
			<label for="fitchRating">FitchRating</label>
			<input type="number" th:field="*{fitchRating}"
				   id="fitchRating" class="col-4">

			<p class="text-danger"
			   th:if="${#fields.hasErrors('fitchRating')}"
			   th:errors="*{fitchRating}"></p>
		</div>

		<div class="form-group">
			<label for="orderNumber">Order</label>
			<input type="number" th:field="*{orderNumber}"
				   id="orderNumber" class="col-4">

			<p class="text-danger"
			   th:if="${#fields.hasErrors('orderNumber')}"
			   th:errors="*{orderNumber}"></p>
		</div>

		<a class="btn btn-danger btn-sm"
		   th:href="@{/rating/list}">Cancel</a>

		<input class="btn btn-primary btn-sm"
			   type="submit" value="Add Rating">
	</form>
</div>
</body>
</html>

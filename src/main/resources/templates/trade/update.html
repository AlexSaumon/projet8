
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8"/>
	<title>Update Trade</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
<div class="container">

	<div class="row">
		<h2>Update Trade</h2>
	</div>

	<div class="row">
		<form th:action="@{/trade/update/{id}(id=${trade.tradeId})}"
			  th:object="${trade}"
			  method="post"
			  class="form-horizontal"
			  style="width: 100%">

			<div class="form-group">
				<label for="account">Account</label>
				<input type="text" th:field="*{account}"
					   id="account" placeholder="Account" class="col-4">
				<p class="text-danger"
				   th:if="${#fields.hasErrors('account')}"
				   th:errors="*{account}"></p>
			</div>

			<div class="form-group">
				<label for="type">Type</label>
				<input type="text" th:field="*{type}"
					   id="type" placeholder="Type" class="col-4">
				<p class="text-danger"
				   th:if="${#fields.hasErrors('type')}"
				   th:errors="*{type}"></p>
			</div>

			<div class="form-group">
				<label for="buyQuantity">Buy Quantity</label>
				<input type="number" step="any" th:field="*{buyQuantity}"
					   id="buyQuantity" placeholder="Buy Quantity" class="col-4">
				<p class="text-danger"
				   th:if="${#fields.hasErrors('buyQuantity')}"
				   th:errors="*{buyQuantity}"></p>
			</div>

			<div class="form-group">
				<input type="hidden" th:field="*{tradeId}">
				<a class="btn btn-danger btn-sm" th:href="@{/trade/list}">Cancel</a>
				<input class="btn btn-primary btn-sm"
					   type="submit" value="Update Trade">
			</div>

		</form>
	</div>

</div>
</body>
</html>
